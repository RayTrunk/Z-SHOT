[package]
name = "z-shot"
authors = ["R. Trunk"]
license = "GPL-3.0-or-later"
description = "Z-SHOT — Screenshot-Werkzeug mit Bereichsauswahl, Markierungen und Album"
version = "0.9.1"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
rfd = { version = "0.15", default-features = false }
raw-window-handle = "0.6"
egui_extras = { version = "0.31", default-features = false, features = ["svg"] }
resvg = { version = "0.37", default-features = false }

# Linux: Wayland and X11 windows; screenshots, global shortcuts, file dialogs and
# notifications go through the desktop portals / D-Bus (all pure Rust, no GTK).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync"] }
futures-util = { version = "0.3", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
resvg = { version = "0.37", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
embed-resource = "3"
