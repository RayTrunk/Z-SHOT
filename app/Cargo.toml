[package]
name = "z-shot"
authors = ["R. Trunk"]
license = "GPL-3.0-or-later"
description = "Z-SHOT — Screenshot-Werkzeug mit Bereichsauswahl, Markierungen und Album"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
rfd = "0.15"
raw-window-handle = "0.6"
egui_extras = { version = "0.31", default-features = false, features = ["svg"] }
resvg = { version = "0.37", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
resvg = { version = "0.37", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
embed-resource = "3"
